<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Responsive Fireworks</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div style="visibility: hidden">
      <audio id="fireworks-sound" loop autoplay>
        <source src="fireworks.mp3" type="audio/mpeg" />
        Your browser does not support the audio element.
      </audio>
    </div>

    <canvas id="canvas">Canvas not supported in your browser.</canvas>

    <script>
      const sound = document.getElementById("fireworks-sound");
      // Try to play when the user first interacts
      function enableSound() {
        sound.play().catch((err) => {
          console.log("Autoplay blocked:", err);
        });
        // remove listener after first play
        document.removeEventListener("click", enableSound);
        document.removeEventListener("touchstart", enableSound);
      }

      document.addEventListener("click", enableSound);
      document.addEventListener("touchstart", enableSound);

      // Redirect after 20s
      setTimeout(() => (location.href = "Birthday.html"), 30000);

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      // Function to make canvas always fill window
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas(); // run once on load

      let fireworks = [];
      let particles = [];
      let hue = 120;
      let limiterTotal = 5;
      let limiterTick = 0;
      let timerTotal = 80;
      let timerTick = 0;
      let mousedown = false;
      let mx, my;

      // Polyfill for requestAnimationFrame
      window.requestAnimFrame = (function () {
        return (
          window.requestAnimationFrame ||
          window.webkitRequestAnimationFrame ||
          window.mozRequestAnimationFrame ||
          function (callback) {
            window.setTimeout(callback, 1000 / 60);
          }
        );
      })();

      function random(min, max) {
        return Math.random() * (max - min) + min;
      }

      function calculateDistance(p1x, p1y, p2x, p2y) {
        const xDistance = p1x - p2x;
        const yDistance = p1y - p2y;
        return Math.sqrt(xDistance * xDistance + yDistance * yDistance);
      }

      function Firework(sx, sy, tx, ty) {
        this.x = sx;
        this.y = sy;
        this.sx = sx;
        this.sy = sy;
        this.tx = tx;
        this.ty = ty;
        this.distanceToTarget = calculateDistance(sx, sy, tx, ty);
        this.distanceTraveled = 0;
        this.coordinates = [];
        this.coordinateCount = 3;
        while (this.coordinateCount--) this.coordinates.push([this.x, this.y]);
        this.angle = Math.atan2(ty - sy, tx - sx);
        this.speed = 2;
        this.acceleration = 1.05;
        this.brightness = random(50, 70);
        this.targetRadius = 1;
      }

      Firework.prototype.update = function (index) {
        this.coordinates.pop();
        this.coordinates.unshift([this.x, this.y]);

        if (this.targetRadius < 8) this.targetRadius += 0.3;
        else this.targetRadius = 1;

        this.speed *= this.acceleration;
        const vx = Math.cos(this.angle) * this.speed;
        const vy = Math.sin(this.angle) * this.speed;
        this.distanceTraveled = calculateDistance(
          this.sx,
          this.sy,
          this.x + vx,
          this.y + vy
        );

        if (this.distanceTraveled >= this.distanceToTarget) {
          createParticles(this.tx, this.ty);
          fireworks.splice(index, 1);
        } else {
          this.x += vx;
          this.y += vy;
        }
      };

      Firework.prototype.draw = function () {
        ctx.beginPath();
        ctx.moveTo(
          this.coordinates[this.coordinates.length - 1][0],
          this.coordinates[this.coordinates.length - 1][1]
        );
        ctx.lineTo(this.x, this.y);
        ctx.strokeStyle = `hsl(${hue}, 100%, ${this.brightness}%)`;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(this.tx, this.ty, this.targetRadius, 0, Math.PI * 2);
        ctx.stroke();
      };

      function Particle(x, y) {
        this.x = x;
        this.y = y;
        this.coordinates = [];
        this.coordinateCount = 5;
        while (this.coordinateCount--) this.coordinates.push([this.x, this.y]);
        this.angle = random(0, Math.PI * 2);
        this.speed = random(1, 10);
        this.friction = 0.95;
        this.gravity = 1;
        this.hue = random(hue - 50, hue + 50);
        this.brightness = random(50, 80);
        this.alpha = 1;
        this.decay = random(0.015, 0.03);
      }

      Particle.prototype.update = function (index) {
        this.coordinates.pop();
        this.coordinates.unshift([this.x, this.y]);
        this.speed *= this.friction;
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed + this.gravity;
        this.alpha -= this.decay;
        if (this.alpha <= this.decay) particles.splice(index, 1);
      };

      Particle.prototype.draw = function () {
        ctx.beginPath();
        ctx.moveTo(
          this.coordinates[this.coordinates.length - 1][0],
          this.coordinates[this.coordinates.length - 1][1]
        );
        ctx.lineTo(this.x, this.y);
        ctx.strokeStyle = `hsla(${this.hue}, 100%, ${this.brightness}%, ${this.alpha})`;
        ctx.stroke();
      };

      function createParticles(x, y) {
        let particleCount = 30;
        while (particleCount--) particles.push(new Particle(x, y));
      }

      function loop() {
        requestAnimFrame(loop);
        hue = random(0, 360);
        ctx.globalCompositeOperation = "destination-out";
        ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalCompositeOperation = "lighter";

        for (let i = fireworks.length - 1; i >= 0; i--) {
          fireworks[i].draw();
          fireworks[i].update(i);
        }
        for (let i = particles.length - 1; i >= 0; i--) {
          particles[i].draw();
          particles[i].update(i);
        }

        if (timerTick >= timerTotal) {
          if (!mousedown) {
            fireworks.push(
              new Firework(
                canvas.width / 2,
                canvas.height,
                random(0, canvas.width),
                random(0, canvas.height / 2)
              )
            );
            timerTick = 0;
          }
        } else timerTick++;

        if (limiterTick >= limiterTotal) {
          if (mousedown) {
            fireworks.push(
              new Firework(canvas.width / 2, canvas.height, mx, my)
            );
            limiterTick = 0;
          }
        } else limiterTick++;
      }

      canvas.addEventListener("mousemove", (e) => {
        mx = e.clientX;
        my = e.clientY;
      });

      canvas.addEventListener("mousedown", (e) => {
        e.preventDefault();
        mousedown = true;
      });

      canvas.addEventListener("mouseup", (e) => {
        e.preventDefault();
        mousedown = false;
      });

      window.onload = loop;
    </script>
  </body>
</html>
